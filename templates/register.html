{% extends "base.html" %}

{% block content %}

<div class="auth-box">

    <h1>Create Account</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            minlength="6"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
